name: ZevClip

options:
  bundleIdPrefix: com.zevclip
  deploymentTarget:
    macOS: "14.0"

targets:
  ZevClip:
    type: application
    platform: macOS
    sources:
      - ZevClip
    info:
      path: ZevClip/Info.plist
      properties:
        CFBundleDisplayName: ZevLink
        CFBundleShortVersionString: "4.0.2"
        CFBundleVersion: "35"
        LSApplicationCategoryType: public.app-category.utilities
        LSUIElement: true
        NSBonjourServices:
          - _zevclip._tcp
          - _zevclip-android._tcp
        NSLocalNetworkUsageDescription: ZevLink receives clipboard text from devices on your local network.
        NSBluetoothAlwaysUsageDescription: ZevLink uses Bluetooth to communicate with your Android device offline.
        NSBluetoothPeripheralUsageDescription: ZevLink advertises Bluetooth to communicate with your Android device offline.
        NSServices:
          - NSMenuItem:
              default: Send to Phone
            NSMessage: sendFilesToPhone
            NSPortName: ZevLink
            NSSendFileTypes:
              - public.item
            NSUserData: send-files-to-phone
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zevlink.receiver
        PRODUCT_NAME: ZevLink
        SWIFT_VERSION: "5.0"
        MARKETING_VERSION: "4.0.2"
        CURRENT_PROJECT_VERSION: "34"
        CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
        ENABLE_DEBUG_DYLIB: NO
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_APP_SANDBOX: NO
        OTHER_CODE_SIGN_FLAGS: "--options runtime"
